name: Deploy AI Engineer Studio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate curriculum and app wiring
        run: npm run validate:ci

      - name: Sync curriculum to public bundle
        run: npm run curriculum

      - name: Inject studio-config.json for OAuth (runtime fallback)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$VITE_GOOGLE_CLIENT_ID" ]; then
            node --input-type=module -e "
              import fs from 'node:fs';
              fs.writeFileSync(
                'public/studio-config.json',
                JSON.stringify({ googleClientId: process.env.VITE_GOOGLE_CLIENT_ID }, null, 2) + '\n'
              );
            "
          fi

      - name: Build React Studio
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_STUDIO_SYNC_URL: ${{ secrets.VITE_STUDIO_SYNC_URL }}
          VITE_THEORY_SYNC_URL: ${{ secrets.VITE_THEORY_SYNC_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
